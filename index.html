<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Losownik</title>
<style>
  :root{
    --bg:#000000;
    --fg:#f4f4f5;
    --muted:#5a5a60;
    --line:rgba(255,255,255,.10);
    --panel:rgba(14,14,16,.86);
    --accent:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
    position:fixed;inset:0;
  }

  /* ---- invisible hitboxes ---- */
  .hitbox{
    position:fixed;left:0;right:0;height:13vh;min-height:84px;
    z-index:40;cursor:pointer;background:transparent;
  }
  .hitbox.top{top:0;}
  .hitbox.bottom{bottom:0;}
  /* faint hint line that fades after load so user knows where to tap */
  .hint{
    position:fixed;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);
    z-index:41;pointer-events:none;
    transition:opacity .8s ease;
  }
  .hint.top{top:11px;}
  .hint.bottom{bottom:11px;}
  body.hide-hints .hint{opacity:0;}

  /* ---- main stage ---- */
  .stage{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;
    cursor:pointer;
  }
  .result{
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:6vh;
    transform:scale(1);opacity:1;
    transition:transform .42s cubic-bezier(.16,1,.3,1),opacity .3s ease;
    will-change:transform,opacity;
  }
  .result.flip{transform:scale(.6);opacity:0;}

  .word{
    font-weight:600;letter-spacing:-.02em;line-height:.95;
    font-size:clamp(56px,18vw,160px);
  }
  .num{
    font-weight:600;letter-spacing:-.04em;line-height:.9;
    font-size:clamp(90px,34vw,300px);font-variant-numeric:tabular-nums;
  }
  .arrow svg{width:clamp(120px,40vw,260px);height:auto;display:block;}
  .stroke{stroke:var(--fg);}

  .tagline{
    color:var(--muted);font-size:13px;letter-spacing:.32em;text-transform:uppercase;
    font-weight:600;
  }
  .hint-tap{
    position:fixed;left:0;right:0;bottom:calc(13vh + 22px);text-align:center;
    color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    z-index:11;pointer-events:none;transition:opacity .5s ease;
  }
  body.drawn .hint-tap{opacity:0;}

  /* ---- dice ---- */
  .dice{
    width:clamp(130px,42vw,220px);aspect-ratio:1;border-radius:24px;
    background:#0d0d0f;border:1px solid var(--line);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:16%;gap:6%;
    box-shadow:0 30px 80px -30px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .pip{border-radius:50%;background:var(--fg);align-self:center;justify-self:center;width:100%;aspect-ratio:1;visibility:hidden;}
  .pip.on{visibility:visible;}

  /* ---- menu sheet ---- */
  .scrim{
    position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s;
  }
  .scrim.open{opacity:1;visibility:visible;}

  .sheet{
    position:fixed;left:0;right:0;z-index:60;
    background:var(--panel);
    backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
    border:1px solid var(--line);
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    transition:transform .42s cubic-bezier(.16,1,.3,1);
  }
  .sheet.top{top:0;border-top:0;border-left:0;border-right:0;
    border-radius:0 0 26px 26px;transform:translateY(-115%);
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .sheet.bottom{bottom:0;border-bottom:0;border-left:0;border-right:0;
    border-radius:26px 26px 0 0;transform:translateY(115%);
  }
  .sheet.open{transform:translateY(0);}

  .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 18px;}
  .sheet.bottom .grab{margin-top:-6px;}

  .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:0 auto;}
  .mode{
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;
    padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;
    cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .12s ease;
    color:var(--fg);
  }
  .mode:active{transform:scale(.95);}
  .mode.sel{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);}
  .mode .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
  .mode .ic svg{width:100%;height:100%;}
  .mode .lbl{font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase;text-align:center;line-height:1.2;}
  .mode.sel .lbl{color:var(--fg);}

  /* range config */
  .range{
    max-width:520px;margin:18px auto 0;overflow:hidden;
    max-height:0;opacity:0;transition:max-height .35s ease,opacity .3s ease,margin .35s ease;
  }
  .range.show{max-height:120px;opacity:1;}
  .range-row{display:flex;gap:12px;}
  .field{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 14px;}
  .field label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .field input{
    width:100%;background:transparent;border:0;outline:none;color:var(--fg);
    font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;font-family:inherit;
  }
  .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .foot{
    max-width:520px;margin:18px auto 0;display:flex;align-items:center;justify-content:space-between;gap:14px;
    color:var(--muted);font-size:11px;letter-spacing:.04em;
  }
  .swap{
    display:inline-flex;align-items:center;gap:8px;color:var(--muted);
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;
    padding:8px 14px;cursor:pointer;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  }
  .swap:active{transform:scale(.96);}
  .swap svg{width:15px;height:15px;}

  /* toast for the double-tap swap */
  .toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    z-index:80;background:rgba(20,20,22,.92);border:1px solid var(--line);
    border-radius:16px;padding:14px 22px;color:var(--fg);font-size:14px;font-weight:600;letter-spacing:.02em;
    opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease,visibility .25s;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:none;text-align:center;
  }
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>

  <!-- invisible tap zones -->
  <div class="hitbox top" id="hitTop"></div>
  <div class="hitbox bottom" id="hitBottom"></div>
  <div class="hint top" id="hintTop"></div>
  <div class="hint bottom" id="hintBottom"></div>

  <!-- main stage -->
  <div class="stage" id="stage">
    <div class="result" id="result">
      <div class="tagline">Losownik</div>
    </div>
  </div>
  <div class="hint-tap" id="hintTap">Dotknij ekranu, aby wylosować</div>

  <!-- menu -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet top" id="sheet">
    <div class="grab"></div>
    <div class="modes" id="modes"></div>
    <div class="range" id="range">
      <div class="range-row">
        <div class="field"><label>Od</label><input id="rmin" type="number" inputmode="numeric" value="1"></div>
        <div class="field"><label>Do</label><input id="rmax" type="number" inputmode="numeric" value="100"></div>
      </div>
    </div>
    <div class="foot">
      <span id="footHint">Dotknij ekranu, aby losować</span>
      <button class="swap" id="swapBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l3-3M17 20l-3-3"/></svg>
        <span id="swapLbl">Menu na dole</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- icons ----------
  var S = 'stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  var IC = {
    yn:   '<svg viewBox="0 0 24 24" '+S+'><path d="M5 13l4 4L19 7"/></svg>',
    lr:   '<svg viewBox="0 0 24 24" '+S+'><path d="M9 7l-5 5 5 5M15 7l5 5-5 5M4 12h6M14 12h6"/></svg>',
    lrf:  '<svg viewBox="0 0 24 24" '+S+'><path d="M12 4v6M12 4l-3 3M12 4l3 3M6 14l-2 2 2 2M4 16h5M18 14l2 2-2 2M20 16h-5"/></svg>',
    dice: '<svg viewBox="0 0 24 24" '+S+'><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>',
    num:  '<svg viewBox="0 0 24 24" '+S+'><path d="M6 4v16M6 4l-2 2M18 20v-9M18 11l-3 3"/></svg>'
  };

  // big result arrows
  function arrowSVG(dir){
    var p = {
      left:  'M22 32H6M6 32l10-10M6 32l10 10',
      right: 'M2 32h16M18 32L8 22M18 32 8 42',
      up:    'M12 22v20M12 22 2 32M12 22l10 10'
    };
    var paths = dir.map(function(d){
      var off = dir.length===1?12:(d==='left'?2:d==='right'?86:44);
      return '<g transform="translate('+off+',0)"><path class="stroke" d="'+p[d]+'" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>';
    }).join('');
    var w = dir.length===1?48:128;
    return '<div class="arrow"><svg viewBox="0 0 '+w+' 64">'+paths+'</svg></div>';
  }

  // dice pip layout
  var PIPS = {
    1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]
  };
  function diceHTML(n){
    var cells='';
    for(var i=0;i<9;i++){cells+='<div class="pip'+(PIPS[n].indexOf(i)>-1?' on':'')+'"></div>';}
    return '<div class="dice">'+cells+'</div>';
  }

  // ---------- modes ----------
  var MODES = [
    {id:'yn',  label:'Tak / Nie', icon:IC.yn},
    {id:'lr',  label:'Lewo / Prawo', icon:IC.lr},
    {id:'lrf', label:'Lewo / Prawo / Przód', icon:IC.lrf},
    {id:'dice',label:'Kostka', icon:IC.dice},
    {id:'num', label:'Liczba', icon:IC.num}
  ];

  var state = {
    mode: load('mode','yn'),
    pos:  load('pos','top'),        // where the menu lives: 'top' | 'bottom'
    min:  parseInt(load('min','1'),10),
    max:  parseInt(load('max','100'),10)
  };

  function load(k,d){try{var v=localStorage.getItem('los_'+k);return v===null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem('los_'+k,v);}catch(e){}}

  // ---------- elements ----------
  var $ = function(id){return document.getElementById(id);};
  var stage=$('stage'), result=$('result'), sheet=$('sheet'), scrim=$('scrim'),
      modesEl=$('modes'), rangeEl=$('range'), rmin=$('rmin'), rmax=$('rmax'),
      toast=$('toast'), swapLbl=$('swapLbl'), hintTap=$('hintTap');

  // build mode buttons
  MODES.forEach(function(m){
    var b=document.createElement('div');
    b.className='mode';b.dataset.id=m.id;
    b.innerHTML='<div class="ic">'+m.icon+'</div><div class="lbl">'+m.label+'</div>';
    b.addEventListener('click',function(){ setMode(m.id); });
    modesEl.appendChild(b);
  });

  rmin.value=state.min; rmax.value=state.max;
  rmin.addEventListener('change',function(){state.min=parseInt(rmin.value,10)||0;save('min',state.min);});
  rmax.addEventListener('change',function(){state.max=parseInt(rmax.value,10)||0;save('max',state.max);});

  function setMode(id){
    state.mode=id;save('mode',id);
    [].forEach.call(modesEl.children,function(c){c.classList.toggle('sel',c.dataset.id===id);});
    rangeEl.classList.toggle('show',id==='num');
  }

  function rnd(n){return Math.floor(Math.random()*n);}
  function vibe(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}

  // ---------- drawing ----------
  function draw(){
    var html='';
    switch(state.mode){
      case 'yn':
        html='<div class="word">'+(rnd(2)?'TAK':'NIE')+'</div>';break;
      case 'lr':
        html=arrowSVG([rnd(2)?'right':'left']);break;
      case 'lrf':
        html=arrowSVG([['left','right','up'][rnd(3)]]);break;
      case 'dice':
        html=diceHTML(rnd(6)+1);break;
      case 'num':
        var lo=Math.min(state.min,state.max),hi=Math.max(state.min,state.max);
        html='<div class="num">'+(lo+rnd(hi-lo+1))+'</div>';break;
    }
    result.classList.add('flip');
    vibe(14);
    setTimeout(function(){
      result.innerHTML=html;
      result.classList.remove('flip');
    },160);
    document.body.classList.add('drawn');
  }

  // tap the stage to draw
  stage.addEventListener('click',function(){ if(!scrim.classList.contains('open')) draw(); });

  // ---------- menu open/close ----------
  function openMenu(){
    placeSheet();
    [].forEach.call(modesEl.children,function(c){c.classList.toggle('sel',c.dataset.id===state.mode);});
    rangeEl.classList.toggle('show',state.mode==='num');
    scrim.classList.add('open');
    requestAnimationFrame(function(){sheet.classList.add('open');});
  }
  function closeMenu(){
    sheet.classList.remove('open');
    scrim.classList.remove('open');
  }
  scrim.addEventListener('click',closeMenu);

  function placeSheet(){
    sheet.classList.remove('top','bottom');
    sheet.classList.add(state.pos);
    swapLbl.textContent = state.pos==='top' ? 'Menu na dole' : 'Menu u góry';
  }
  placeSheet();
  setMode(state.mode);

  // ---------- hitboxes ----------
  // single tap on the active-side hitbox opens the menu.
  // double tap on the opposite hitbox swaps the menu side.
  var hitTop=$('hitTop'), hitBottom=$('hitBottom'), hintTop=$('hintTop'), hintBottom=$('hintBottom');

  function bindHit(el, side){
    var lastTap=0;
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var now=Date.now();
      var isDouble=(now-lastTap)<300;
      lastTap=now;

      if(isDouble){
        lastTap=0;
        swapSide();
        return;
      }
      // single tap: only the side that currently holds the menu opens it
      setTimeout(function(){
        // if a double-tap already fired, lastTap was reset to 0
        if(lastTap===0) return;
        if(side===state.pos){
          openMenu();
        }
      },330);
    });
  }
  bindHit(hitTop,'top');
  bindHit(hitBottom,'bottom');

  function swapSide(){
    state.pos = state.pos==='top' ? 'bottom' : 'top';
    save('pos',state.pos);
    placeSheet();
    showToast(state.pos==='top' ? 'Menu przeniesione na górę' : 'Menu przeniesione na dół');
    vibe([10,40,10]);
  }

  var toastT;
  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(function(){toast.classList.remove('show');},1400);
  }

  // ---------- intro hint fade ----------
  setTimeout(function(){document.body.classList.add('hide-hints');},2600);

  // keyboard convenience (desktop)
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!scrim.classList.contains('open'))draw();}
    if(e.key==='m'||e.key==='M'){scrim.classList.contains('open')?closeMenu():openMenu();}
    if(e.key==='Escape')closeMenu();
  });

  // prevent double-tap zoom on iOS
  var lastTouch=0;
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-lastTouch<=350){e.preventDefault();}
    lastTouch=now;
  },{passive:false});

})();
</script>
</body>
</html>
